version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # 个人博客站点，不需要每天收依赖 PR；改成每月一次
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    pull-request-branch-name:
      separator: "-"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

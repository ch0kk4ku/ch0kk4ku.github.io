name: Deploy to GitHub Pages

on:
  # 本仓库当前分支是 master；若你建仓库时默认分支是 main，请在下面补上 main 再推送
  push:
    branches: [ master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build
        env:
          # GitHub Pages 的子路径。env 的值不做表达式求值，所以这里必须写死。
          # 本站是用户站（仓库名 = ch0kk4ku.github.io），发布在根路径，因此为 "/"。
          # 若以后改为项目站 https://<用户名>.github.io/<仓库名>/，改成 "/<仓库名>/"。
          # 这一行必须与 astro.config.mjs 的 base 默认值、以及 siteConfig.site_url 保持一致。
          SITE_BASE: "/"

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4